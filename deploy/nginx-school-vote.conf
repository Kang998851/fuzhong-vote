# 附中墙 nginx 反向代理样例
# 复制到 /etc/nginx/sites-available/school-vote，改域名后软链到 sites-enabled 并 reload
# 上游为 systemd 里 gunicorn 监听的 127.0.0.1:5000
upstream school_vote {
    server 127.0.0.1:5000;
}

server {
    # TODO: 改成实际域名
    server_name vote.example.com;

    # HTTP 跳 HTTPS（拿到证书后启用；先用 HTTP 调通可暂时注释掉）
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://school_vote;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传图片较大，放宽请求体（与应用 4MB 上限呼应）
    client_max_body_size 8m;
}

# HTTPS 配置建议：用 certbot 一键签发
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d vote.example.com
# 成功后 certbot 会自动改写本文件加上 443 段。
