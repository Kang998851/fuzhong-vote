{% extends "base.html" %}
{% set active_page = '' %}
{% block title %}{{ '注册' if mode=='register' else '登录' }}{% endblock %}
{% block content %}
<section class="card narrow">
  <div class="card-label">/ ACCOUNT</div>
  <h2 class="card-title">{{ '注册账号' if mode=='register' else '登录' }}</h2>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>用户名<input type="text" name="username" required minlength="2" maxlength="20" placeholder="2-20 个字符"></label>
    <label>密码<input type="password" name="password" required minlength="4" placeholder="至少 4 位"></label>
    <button class="btn btn-primary" type="submit">{{ '注册' if mode=='register' else '登录' }}</button>
  </form>
  <p class="dim center" style="margin-top:14px">
    {% if mode=='register' %}已有账号？<a href="{{ url_for('login') }}">去登录</a>
    {% else %}没有账号？<a href="{{ url_for('register') }}">去注册</a>{% endif %}
  </p>
</section>
{% endblock %}
