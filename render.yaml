# Render 一键部署：web 服务 + Postgres 数据库（免费方案）
# 在 Render Dashboard → New → Blueprint，指向本仓库即可一键创建。
services:
  - type: web
    name: fuzhong-wall
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c \"from app import app, init_db; ctx = app.app_context(); ctx.push(); init_db()\""
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fuzhong-db
          property: connectionString
      - key: VOTE_DEADLINE
        value: "2026-10-07 23:59"
      - key: PYTHON_VERSION
        value: "3.12.3"

databases:
  - name: fuzhong-db
    plan: free
    databaseName: fuzhong
    user: fuzhong
